backend:
  name: github
  repo: AlaeUIUX/psychmind-website
  branch: main
  base_url: https://psychmind-website.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/blog/uploads"
public_folder: "/images/blog/uploads"

collections:
  - name: "blog"
    label: "Blog posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          hint: "Short summary shown on the blog listing cards",
        }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Mental health", "Guide", "Wellness", "Design and Dev", "Company"]
      - label: "Written by"
        name: "source"
        widget: "select"
        options: [{ label: "The PsychMind team", value: "team" }, { label: "A provider on PsychMind", value: "provider" }]
        default: "team"
        hint: "Which list the post appears in on the blog"
      - { label: "Author", name: "author", widget: "string" }
      - {
          label: "Author title/credentials",
          name: "authorTitle",
          widget: "string",
          required: false,
        }
      - {
          label: "Author avatar",
          name: "authorAvatar",
          widget: "image",
          required: false,
        }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. March 2025" }
      - { label: "Read time", name: "readTime", widget: "string", hint: "e.g. 8 min read" }
      - label: "Cover picture"
        name: "cover"
        widget: "select"
        options:
          - { label: "The search bar", value: "search" }
          - { label: "Credentials under a loupe", value: "verified" }
          - { label: "Search's session format and places", value: "location" }
          - { label: "Daily totals on the dashboard", value: "analytics" }
          - { label: "The therapy approach filter", value: "approach" }
          - { label: "The request card", value: "request" }
          - { label: "The girl in her boat", value: "boat" }
          - { label: "The girl where two roads part", value: "two-roads" }
          - { label: "The girl under a rain cloud", value: "rain-cloud" }
        default: "search"
        hint: "Product posts: the UI it's about. Posts about people: one of the girl's pictures. Nothing is written on the cover; the title does that"
      - {
          label: "Featured on blog page",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use headings (##) for section titles, and the quote button for pull-quotes."
