backend:
  name: github
  repo: AlaeUIUX/psychmind-website
  branch: main
  base_url: https://psychmind-website.vercel.app
  auth_endpoint: api/auth

media_folder: "public/images/blog/uploads"
public_folder: "/images/blog/uploads"

collections:
  - name: "blog"
    label: "Blog posts"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          hint: "Short summary shown on the blog listing cards",
        }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Mental health", "Guide", "Wellness", "Design and Dev", "Company"]
      - { label: "Author", name: "author", widget: "string" }
      - {
          label: "Author title/credentials",
          name: "authorTitle",
          widget: "string",
          required: false,
        }
      - {
          label: "Author avatar",
          name: "authorAvatar",
          widget: "image",
          required: false,
        }
      - { label: "Date", name: "date", widget: "string", hint: "e.g. March 2025" }
      - { label: "Read time", name: "readTime", widget: "string", hint: "e.g. 8 min read" }
      - {
          label: "Hero image",
          name: "heroImage",
          widget: "image",
          required: false,
          hint: "Full-width image shown under the title",
        }
      - {
          label: "Thumbnail (blog grid card)",
          name: "thumbnail",
          widget: "image",
          required: false,
        }
      - {
          label: "Featured on blog page",
          name: "featured",
          widget: "boolean",
          default: false,
        }
      - label: "Body"
        name: "body"
        widget: "markdown"
        hint: "Use headings (##) for section titles, and the quote button for pull-quotes."
