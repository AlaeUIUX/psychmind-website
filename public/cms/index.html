<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PsychMind CMS</title>
    <!-- Absolute path so config.yml still resolves correctly when this page
         is served at /cms (no trailing slash) instead of /cms/. -->
    <link href="/cms/config.yml" type="text/yaml" rel="cms-config-url" />
  </head>
  <body>
    <!-- Pinned to one exact build, with its integrity hash (checked against
         unpkg and jsDelivr, 2026-11-10): a changed file on the CDN won't run.
         To update: change the version, recompute the hash
         (curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A). -->
    <script
      src="https://unpkg.com/decap-cms@3.17.3/dist/decap-cms.js"
      integrity="sha384-RWRzuHfiZSWCt3nEvG7B0v3cMgM1C2UuJmgBSL92GQh4uXmNSkbcthql/mNBqvjr"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
